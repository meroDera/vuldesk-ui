<!doctype html>
<!-- og card source (eng review E12, 2026-10-31). Render at 1200 x 628 into
     src/assets/images/default.png, from the repo root:
       bun ~/.hermes/skills/gstack/bin/gstack-render.ts docs/designs/assets/og-card.html \
         --serve-root . --wait-expr "document.fonts.status === 'loaded'" \
         --screenshot src/assets/images/default.png --width 1200 --height 628
     Keep the headline and typography aligned with the H1 in src/pages/index.astro. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vuldesk og card</title>
    <style>
      @font-face {
        font-family: 'Source Serif 4 Variable';
        src: url('../../../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 900;
      }
      @font-face {
        font-family: 'Source Serif 4 Variable';
        src: url('../../../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-italic.woff2')
          format('woff2');
        font-style: italic;
        font-weight: 200 900;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 628px;
        overflow: hidden;
        background: #faf2e4;
        color: #332016;
        font-family: 'Source Serif 4 Variable', serif;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 628px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
      }
      .wordmark {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .headline {
        margin-top: auto;
        margin-bottom: auto;
        border-left: 3px solid #a02d24;
        padding-left: 28px;
        font-size: 72px;
        line-height: 1.08;
        font-weight: 550;
        max-width: 1000px;
        letter-spacing: -0.045em;
        text-wrap: balance;
      }
      .headline em {
        display: block;
        margin-top: 12px;
        color: #a02d24;
        font-size: 0.68em;
        font-weight: 500;
        letter-spacing: -0.035em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="wordmark">VULDESK</div>
      <div class="headline" id="headline">
        Your outside CTO. <em>We handle releases, performance, and cloud costs.</em>
      </div>
    </div>
  </body>
</html>
