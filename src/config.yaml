site:
  name: vuldesk
  site: 'https://www.vuldesk.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: Vuldesk — AI tools that read your records and give you answers
    template: '%s — Vuldesk'
  description: "Every business has a pile of records that someone reads by hand. I build a tool that reads yours and tells you what matters. A price fixed before we start."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Vuldesk
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@vuldesk_tech'
    site: '@vuldesk_tech'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    # Disabled 2026-08-20 (design doc route table): the three pentest-era posts
    # described a different business than the homepage sells. Files kept as
    # draft: true; re-enable only with posts that match the positioning.
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: false
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: false
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    # Disabled: the [category] and [tag] route files were deleted in d0b2a55,
    # so these only rendered links to pages that 404. Re-enable together with
    # src/pages/[...blog]/[category]/ and [tag]/ if the blog outgrows a flat list.
    category:
      isEnabled: false
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # D5 (design review 2026-08-20): the page is a light-paper artifact; one render to design and test
