site:
  name: vuldesk
  site: 'https://www.vuldesk.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: Vuldesk
    template: '%s — Vuldesk'
  description: "AI feature security reviews for B2B SaaS. Prompt injection, retrieval permission boundaries, and data flow to model providers — tested in five days for a fixed $3,500, with no access to your production system. You get the report your enterprise buyers ask for."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Vuldesk
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@vuldesk'
    site: '@vuldesk'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    # Disabled: the [category] and [tag] route files were deleted in d0b2a55,
    # so these only rendered links to pages that 404. Re-enable together with
    # src/pages/[...blog]/[category]/ and [tag]/ if the blog outgrows a flat list.
    category:
      isEnabled: false
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
